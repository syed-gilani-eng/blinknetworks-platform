<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2ac5e8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#2ac5e8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lineGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1976e9"/>
      <stop offset="100%" stop-color="#2ac5e8"/>
    </linearGradient>
  </defs>

  <g stroke="url(#lineGradient)" stroke-width="2.5" stroke-linecap="round" opacity="0.85" fill="none">
    <line x1="380" y1="235" x2="430" y2="75"/>
    <line x1="380" y1="235" x2="205" y2="100"/>
    <line x1="380" y1="235" x2="630" y2="130"/>
    <line x1="380" y1="235" x2="120" y2="250"/>
    <line x1="380" y1="235" x2="215" y2="365"/>
    <line x1="380" y1="235" x2="400" y2="390"/>
    <line x1="380" y1="235" x2="615" y2="355"/>
  </g>

  <circle cx="380" cy="235" r="95" fill="url(#hubGlow)"/>
  <circle cx="380" cy="235" r="70" fill="#0c2948" stroke="#2ac5e8" stroke-width="3"/>
  <circle cx="380" cy="235" r="60" fill="#071a2d"/>

  <!-- Cloud -->
  <g transform="translate(430,75)">
    <circle r="34" fill="#0c2948" stroke="#2ac5e8" stroke-width="1.5" stroke-opacity="0.6"/>
    <g fill="#eaf5ff">
      <circle cx="-8" cy="-2" r="7"/>
      <circle cx="6" cy="-4" r="9"/>
      <circle cx="15" cy="0" r="6"/>
      <rect x="-14" y="-2" width="34" height="11" rx="5.5"/>
    </g>
    <text y="50" text-anchor="middle" font-size="17" font-weight="600" fill="#eaf5ff" font-family="Arial, Helvetica, sans-serif">Cloud</text>
  </g>

  <!-- Infrastructure -->
  <g transform="translate(205,100)">
    <circle r="34" fill="#0c2948" stroke="#2ac5e8" stroke-width="1.5" stroke-opacity="0.6"/>
    <g fill="#eaf5ff">
      <rect x="-12" y="-14" width="24" height="8" rx="2"/>
      <rect x="-12" y="-3" width="24" height="8" rx="2"/>
      <rect x="-12" y="8" width="24" height="8" rx="2"/>
    </g>
    <circle cx="6" cy="-10" r="1.6" fill="#2ac5e8"/>
    <circle cx="6" cy="1" r="1.6" fill="#2ac5e8"/>
    <circle cx="6" cy="12" r="1.6" fill="#2ac5e8"/>
    <text y="50" text-anchor="middle" font-size="17" font-weight="600" fill="#eaf5ff" font-family="Arial, Helvetica, sans-serif">Infrastructure</text>
  </g>

  <!-- Security -->
  <g transform="translate(630,130)">
    <circle r="34" fill="#0c2948" stroke="#2ac5e8" stroke-width="1.5" stroke-opacity="0.6"/>
    <path d="M0,-16 L14,-10 V2 C14,12 7,18 0,20 C-7,18 -14,12 -14,2 V-10 Z" fill="#eaf5ff"/>
    <text y="50" text-anchor="middle" font-size="17" font-weight="600" fill="#eaf5ff" font-family="Arial, Helvetica, sans-serif">Security</text>
  </g>

  <!-- Devices -->
  <g transform="translate(120,250)">
    <circle r="34" fill="#0c2948" stroke="#2ac5e8" stroke-width="1.5" stroke-opacity="0.6"/>
    <g fill="#eaf5ff">
      <rect x="-13" y="-13" width="26" height="17" rx="2"/>
      <rect x="-16" y="6" width="32" height="4" rx="2"/>
    </g>
    <text y="50" text-anchor="middle" font-size="17" font-weight="600" fill="#eaf5ff" font-family="Arial, Helvetica, sans-serif">Devices</text>
  </g>

  <!-- Mobile -->
  <g transform="translate(215,365)">
    <circle r="34" fill="#0c2948" stroke="#2ac5e8" stroke-width="1.5" stroke-opacity="0.6"/>
    <rect x="-9" y="-16" width="18" height="32" rx="4" fill="#eaf5ff"/>
    <circle cx="0" cy="11" r="2.2" fill="#0c2948"/>
    <text y="50" text-anchor="middle" font-size="17" font-weight="600" fill="#eaf5ff" font-family="Arial, Helvetica, sans-serif">Mobile</text>
  </g>

  <!-- Your Team -->
  <g transform="translate(400,390)">
    <circle r="34" fill="#0c2948" stroke="#2ac5e8" stroke-width="1.5" stroke-opacity="0.6"/>
    <g fill="#eaf5ff">
      <circle cx="-6" cy="-9" r="6"/>
      <path d="M-15,10 C-15,0 3,0 3,10 Z"/>
      <circle cx="7" cy="-7" r="6.5"/>
      <path d="M-2,11 C-2,0.3 15,0.3 15,11 Z"/>
    </g>
    <text y="50" text-anchor="middle" font-size="17" font-weight="600" fill="#eaf5ff" font-family="Arial, Helvetica, sans-serif">Your Team</text>
  </g>

  <!-- Your Business -->
  <g transform="translate(615,355)">
    <circle r="34" fill="#0c2948" stroke="#2ac5e8" stroke-width="1.5" stroke-opacity="0.6"/>
    <rect x="-13" y="-16" width="26" height="32" rx="2" fill="#eaf5ff"/>
    <g fill="#0c2948">
      <rect x="-8" y="-11" width="4" height="4"/>
      <rect x="2" y="-11" width="4" height="4"/>
      <rect x="-8" y="-2" width="4" height="4"/>
      <rect x="2" y="-2" width="4" height="4"/>
      <rect x="-8" y="7" width="4" height="4"/>
      <rect x="2" y="7" width="4" height="4"/>
    </g>
    <text y="50" text-anchor="middle" font-size="17" font-weight="600" fill="#eaf5ff" font-family="Arial, Helvetica, sans-serif">Your Business</text>
  </g>
</svg>
