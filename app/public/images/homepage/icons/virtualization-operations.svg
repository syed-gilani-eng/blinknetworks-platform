<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="grad" x1="6" y1="6" x2="58" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1976E9" />
      <stop offset="1" stop-color="#2AC5E8" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.1" result="blur" />
      <feComponentTransfer in="blur" result="blur">
        <feFuncA type="linear" slope="0.35" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <circle cx="32" cy="32" r="23" fill="url(#grad)" opacity="0.08" />
  <g filter="url(#glow)" stroke="url(#grad)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="10" y="14" width="34" height="8" rx="3" />
    <rect x="14" y="28" width="34" height="8" rx="3" />
    <rect x="18" y="42" width="34" height="8" rx="3" />
  </g>
  <g stroke="url(#grad)" stroke-width="1.8" stroke-linecap="round" opacity="0.5">
    <line x1="14" y1="22" x2="18" y2="28" />
    <line x1="18" y1="36" x2="22" y2="42" />
  </g>
</svg>
